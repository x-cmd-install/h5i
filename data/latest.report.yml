e_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":112,"digest":"sha256:771ef33fb26e574a40a8fb392e69fd73214a2552742fe395ce38201dced1308f","download_count":2,"created_at":"2026-11-28T01:40:23Z","updated_at":"2026-11-28T01:40:23Z"},{"id":802777370,"node_id":"RA_kwDORj5l3c4v2Wka","name":"h5i-websec-v0.5.7-x86_64-unknown-linux-musl.tar.gz","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/gzip","state":"uploaded","size":3238253,"digest":"sha256:deed4f9a140f56c0ebca4a281a3f51e750a7c086ba57d516b812c551761856c8","download_count":2,"created_at":"2026-11-28T01:40:23Z","updated_at":"2026-11-28T01:40:23Z"},{"id":802777401,"node_id":"RA_kwDORj5l3c4v2Wk5","name":"h5i-websec-v0.5.7-x86_64-unknown-linux-musl.tar.gz.sha256","label":"","uploader":{"login":"github-actions[bot]","id":41898282,"node_id":"MDM6Qm90NDE4OTgyODI=","gravatar_id":"","type":"Bot","user_view_type":"public","site_admin":false},"content_type":"application/octet-stream","state":"uploaded","size":117,"digest":"sha256:80af13f390a84b09d0f4dbc0a4d993dfe8e45b8b589878fe03fd2476231ca955","download_count":2,"created_at":"2026-11-28T01:40:23Z","updated_at":"2026-11-28T01:40:23Z"}],"body":"## Install\n\nOne binary. `h5i` unifies web development, formal verification\nwith Lean 4, and red-teaming around a composable Rust framework.\n\n**Linux / macOS:**\n```bash\ncurl -L https://github.com/h5i-dev/h5i/releases/download/v0.5.7/h5i-v0.5.7-<TARGET>.tar.gz | tar -xz\nsudo mv h5i /usr/local/bin/\n```\n\n**Windows:** download the `.zip`, extract `h5i.exe`, and add it to your `PATH`.\n\n### The browser\n\n```bash\nh5i browser open https://example.com\nh5i browser snapshot\nh5i browser requests     # what it asked for, and what was refused\nh5i browser audit        # the whole session, afterwards\n```\n\nA session is Chromium, driven through\n[agent-browser](https://github.com/vercel-labs/agent-browser)\n(`npm install -g agent-browser`), and captured at a proxy this\nbinary runs: every request is policy-checked and written down\nbefore it moves.\n\n### The websec workbench\n\n`h5i-websec` is a separate archive, and installing it is a\ndeliberate act:\n\n```bash\ncurl -L https://github.com/h5i-dev/h5i/releases/download/v0.5.7/h5i-websec-v0.5.7-<TARGET>.tar.gz | tar -xz\nh5i plugin install websec --from ./h5i-websec\n```\n\nIt holds no privilege of its own: every verb runs the `h5i browser`\nverbs a person would type, through the same policy, budget and\nreceipts.\n\n### The recon ledger\n\n`h5i-recon` is the other plugin, and it arrives the same way:\n\n```bash\ncurl -L https://github.com/h5i-dev/h5i/releases/download/v0.5.7/h5i-recon-v0.5.7-<TARGET>.tar.gz | tar -xz\nh5i plugin install recon --from ./h5i-recon\n```\n\nIt records what a target exposes, where each candidate came from,\nand which stored message confirmed it. Discovery only: a URL read\nout of a bundle stays a candidate until a request answers for it,\nand nothing here is called a vulnerability.\n\n### Security regression tests\n\n`h5i-test` replays repository-owned attack flows and hands their\nevidence to repository-owned external oracles:\n\n```bash\ncurl -L https://github.com/h5i-dev/h5i/releases/download/v0.5.7/h5i-test-v0.5.7-<TARGET>.tar.gz | tar -xz\nh5i plugin install test --from ./h5i-test\nh5i test .h5i-tests/tests --target http://localhost:3000\n```\n\nIt writes JSON and JUnit. OpenAPI coverage is report-only unless\n`--min-coverage` is explicitly supplied.\n\nEvery request it makes is checked against an allowlist — every\nrequest and every redirect hop — and written to the log before any\nbytes move. A request that is not in `h5i browser requests` did not\nhappen. What a box adds, with `--in`, is that the record gains a\nwitness outside the browser; on a bare host that part is not\nclaimed.\n\n### Available targets\n\n| Target | Platform |\n|--------|---------|\n| `x86_64-unknown-linux-musl` | Linux x86_64 (static, glibc-free) |\n| `aarch64-unknown-linux-musl` | Linux arm64 (static, glibc-free) |\n| `aarch64-apple-darwin` | macOS Apple Silicon (arm64) |\n| `x86_64-pc-windows-msvc` | Windows x86_64 |\n\nIntel Macs have no published build: Rosetta 2 translates x86_64 to\narm64, not the reverse, so the `aarch64-apple-darwin` archive will\nnot run there. Build from source instead:\n`cargo install --git https://github.com/h5i-dev/h5i`\n\nEach archive is accompanied by a `.sha256` checksum file.\n\n\n## What's Changed\n* rename from o5s to o1s by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/815\n* improve video by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/816\n* Embed the demo film from YouTube; keep the MP4 outside docs/ by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/817\n* add o5s and h5i-app-h1 study to showcase by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/818\n* Improve slide by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/819\n* add senv to showcase by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/820\n* h5i app: say when a project's Lean library predates this h5i, and fix… by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/821\n* update the video by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/822\n* update the youtube video by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/823\n* update pitch, landing stats and demo page by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/824\n* update landing stars by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/825\n* h5i-app: add optional Veil temporal verification backend and real Rus… by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/826\n* Update README.md by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/827\n* Clarify automatic specification generation with spec-kit by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/828\n* Improve skill by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/829\n* Update README.md by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/830\n* Update index.html by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/831\n* bump to 0.5.7 by @Koukyosyumei in https://github.com/h5i-dev/h5i/pull/832\n\n\n**Full Changelog**: https://github.com/h5i-dev/h5i/compare/v0.5.6...v0.5.7","mentions_count":1}
